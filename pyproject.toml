[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai>=3.26.0",
    "pandas>=2.3.3",
    "peft>=0.21.2",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "setuptools>=80.10.2",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "vllm>=0.8.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
